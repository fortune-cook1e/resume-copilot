services:
  postgres:
    image: postgres:16-alpine
    container_name: resume-copilot-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-resume}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-resume_copilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - resume-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    image: ${ALIYUN_REGISTRY}/resume-copilot:${IMAGE_TAG:?Set IMAGE_TAG}-api
    container_name: resume-copilot-api
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using postgres as the hostname}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public HTTPS origin}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - resume-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3001/api/health/ready", { signal: AbortSignal.timeout(2000) }).then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  app:
    image: ${ALIYUN_REGISTRY}/resume-copilot:${IMAGE_TAG:?Set IMAGE_TAG}-web
    container_name: resume-copilot-app
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - '3005:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public HTTPS origin}
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    networks:
      - resume-network

volumes:
  postgres_data:
    name: resume-copilot-pgdata-prod

networks:
  resume-network:
    name: resume-copilot-network
    driver: bridge
