name: Cloudflare

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --filter @resume-copilot/web build:cf
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL || secrets.APP_URL || 'http://localhost:3000' }}
      - run: pnpm --filter @resume-copilot/web exec wrangler deploy --dry-run --outdir .worker-test
      - run: node scripts/check-worker-size.mjs
      - run: pnpm --filter @resume-copilot/web exec playwright install --with-deps chromium
      - run: python3 -m pip install pypdf
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results
          retention-days: 3

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
      NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      - name: Configure public bindings
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs'
          import ts from 'typescript'
          const { D1_DATABASE_ID, NEXT_PUBLIC_APP_URL, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN } = process.env
          if (!D1_DATABASE_ID || !CLOUDFLARE_ACCOUNT_ID || !CLOUDFLARE_API_TOKEN || !NEXT_PUBLIC_APP_URL?.startsWith('https://')) throw new Error('Cloudflare configuration is incomplete')
          const path = 'apps/api/wrangler.jsonc'
          const parsed = ts.parseConfigFileTextToJson(path, readFileSync(path, 'utf8'))
          if (parsed.error) throw new Error('Invalid Worker configuration')
          const config = parsed.config
          config.d1_databases[0].database_id = D1_DATABASE_ID
          config.vars.BETTER_AUTH_URL = new URL(NEXT_PUBLIC_APP_URL).origin
          writeFileSync(path, JSON.stringify(config, null, 2))
          JS
      - name: Validate API secrets
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MCP_CLIENT_ID: ${{ secrets.MCP_CLIENT_ID }}
          MCP_CLIENT_SECRET: ${{ secrets.MCP_CLIENT_SECRET }}
          MCP_REDIRECT_URI: ${{ secrets.MCP_REDIRECT_URI }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs'
          const secrets = Object.fromEntries(['BETTER_AUTH_SECRET', 'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET'].map(key => [key, process.env[key]]))
          if (Object.values(secrets).some(value => !value) || secrets.BETTER_AUTH_SECRET.length < 32) throw new Error('API secrets are incomplete')
          const mcp = Object.fromEntries(['MCP_CLIENT_ID', 'MCP_CLIENT_SECRET', 'MCP_REDIRECT_URI'].map(key => [key, process.env[key]]))
          if (Object.values(mcp).some(Boolean)) {
            if (Object.values(mcp).some(value => !value) || mcp.MCP_CLIENT_SECRET.length < 32) throw new Error('MCP secrets are incomplete')
            const redirect = URL.parse(mcp.MCP_REDIRECT_URI)
            if (redirect?.protocol !== 'https:' || redirect.username || redirect.password || redirect.hash) throw new Error('MCP_REDIRECT_URI must be a valid HTTPS callback')
            Object.assign(secrets, mcp)
          }
          writeFileSync(process.env.RUNNER_TEMP + '/api-secrets.json', JSON.stringify(secrets), { mode: 0o600 })
          JS
      - run: pnpm build:cf
      - run: pnpm --filter @resume-copilot/web exec wrangler deploy --dry-run --outdir .worker-test
      - run: node scripts/check-worker-size.mjs
      - run: pnpm --filter @resume-copilot/api db:migrate:remote
      - name: Deploy API with secrets
        run: |
          trap 'rm -f "$RUNNER_TEMP/api-secrets.json"' EXIT
          pnpm --filter @resume-copilot/api exec wrangler deploy --env '' --secrets-file "$RUNNER_TEMP/api-secrets.json"
      - run: pnpm --filter @resume-copilot/web run deploy
      - name: Check public entry
        run: |
          curl --fail --retry 5 --retry-delay 3 "$NEXT_PUBLIC_APP_URL/api/health/ready"
          curl --fail --retry 5 --retry-delay 3 --output /dev/null "$NEXT_PUBLIC_APP_URL/login"
