name: Deploy to Aliyun

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: resume-copilot-production
  cancel-in-progress: false

jobs:
  verify-deployment:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
      - run: bash -n scripts/deploy.sh
      - run: node --test scripts/deploy.test.mjs

  build:
    needs: verify-deployment
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            target: runner
          - name: api
            target: api-runner
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          # The current Aliyun registry rejects OCI provenance attestation manifests.
          provenance: false
          tags: ${{ secrets.ALIYUN_REGISTRY }}/resume-copilot:${{ github.sha }}-${{ matrix.name }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.APP_URL }}
            API_INTERNAL_URL=http://api:3001
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Copy production deployment files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_SSH_USER }}
          password: ${{ secrets.ALIYUN_SSH_PASSWORD }}
          port: ${{ secrets.ALIYUN_SSH_PORT || 22 }}
          source: 'docker-compose.prod.yml,scripts/deploy.sh'
          target: ${{ secrets.ALIYUN_APP_DIR }}
      - name: Deploy the selected release
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_DIRECTORY: ${{ secrets.ALIYUN_APP_DIR }}
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_SSH_USER }}
          password: ${{ secrets.ALIYUN_SSH_PASSWORD }}
          port: ${{ secrets.ALIYUN_SSH_PORT || 22 }}
          command_timeout: 20m
          envs: DEPLOY_DIRECTORY,ALIYUN_REGISTRY,REGISTRY_USERNAME,REGISTRY_PASSWORD,IMAGE_TAG
          script: |
            set -eu
            cd "$DEPLOY_DIRECTORY"
            printf '%s' "$REGISTRY_PASSWORD" | docker login --username "$REGISTRY_USERNAME" --password-stdin "$ALIYUN_REGISTRY"
            bash scripts/deploy.sh
